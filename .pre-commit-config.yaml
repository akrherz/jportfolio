ci:
  autoupdate_schedule: quarterly
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: spotless-apply
        name: spotless-apply
        entry: mvn -q spotless:apply
        language: system
        pass_filenames: false
        files: \.java$
